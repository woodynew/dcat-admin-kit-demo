name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and initialize Docker demo
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check HTTP and process health
        run: |
          curl --fail http://127.0.0.1:18085/up
          curl --fail http://127.0.0.1:18085/ | grep -q '/demo/enter'
          docker compose exec -T php supervisorctl -c /etc/supervisord.conf status
          docker compose exec -T --user www-data php php artisan schedule:list
      - name: Verify recreation preserves key and data
        run: |
          docker compose exec -T --user www-data php php docker/tests/persistence.php seed
          docker compose up -d --force-recreate --wait --wait-timeout 180
          docker compose exec -T --user www-data php php docker/tests/persistence.php verify
      - name: Docker logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop test containers
        if: always()
        run: docker compose down

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan demo:install
          php artisan demo:install
      - run: vendor/bin/phpunit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Initialize browser database and assets
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan demo:install
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
            storage/logs/*.log
          retention-days: 7
